name: Framework Regression

# 需要装有团结（Tuanjie）编辑器的 Windows 自托管 runner：
#   runs-on 标签：self-hosted, windows, tuanjie
#   仓库变量：TUANJIE_EDITOR_PATH = 编辑器可执行文件路径
#
# 自托管机器常把 PowerShell 执行策略设为 Restricted，GitHub 生成的临时 .ps1 会被直接拒绝；
# 因此步骤统一用 cmd 包装，显式以 -ExecutionPolicy Bypass 调 Tools/Ci-*.ps1。
# 说明见 Assets/docs/04-测试与接入/34-CI回归接入.md

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: framework-regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: [self-hosted, windows, tuanjie]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Run framework regression
        shell: cmd
        env:
          TUANJIE_EDITOR_PATH: ${{ vars.TUANJIE_EDITOR_PATH }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Tools\Ci-RunRegression.ps1"

      - name: Summarize report
        if: always()
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File "%GITHUB_WORKSPACE%\Tools\Ci-Summarize.ps1"

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-regression
          path: NowFrameWork/Build/FrameworkRegression/**
          if-no-files-found: warn
          retention-days: 14
